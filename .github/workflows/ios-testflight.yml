name: iOS TestFlight

on:
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/ios-testflight.yml'
  workflow_dispatch:
    inputs:
      submit:
        description: 'Submit to TestFlight after build'
        type: boolean
        default: true

jobs:
  build-and-submit:
    name: Build & Submit to TestFlight
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10'

      - name: Install dependencies
        working-directory: apps/mobile
        run: pnpm install --frozen-lockfile

      - name: Write ASC API key
        working-directory: apps/mobile
        env:
          ASC_API_KEY_CONTENT: ${{ secrets.ASC_API_KEY_CONTENT }}
        run: echo "$ASC_API_KEY_CONTENT" | base64 --decode > asc-api-key.p8

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build iOS production
        working-directory: apps/mobile
        run: |
          eas build \
            --platform ios \
            --profile ios-production \
            --non-interactive \
            ${{ (github.event_name == 'workflow_dispatch' && inputs.submit == true || github.event_name == 'push') && '--auto-submit' || '' }}

      - name: Clean up ASC key
        if: always()
        working-directory: apps/mobile
        run: rm -f asc-api-key.p8
