<script>
        // Simple micro-interaction for cards
        document.querySelectorAll('.glass-card').forEach(card => {
            card.addEventListener('mouseenter', () => {
                card.style.transform = 'translateY(-4px)';
                card.style.transition = 'transform 0.3s ease';
            });
            card.addEventListener('mouseleave', () => {
                card.style.transform = 'translateY(0px)';
            });
        });

        // Atmospheric mouse follow effect (subtle)
        document.addEventListener('mousemove', (e) => {
            const x = (e.clientX / window.innerWidth) * 100;
            const y = (e.clientY / window.innerHeight) * 100;
            document.querySelector('.atmospheric-bg').style.background = `
                radial-gradient(circle at ${x}% ${y}%, rgba(255, 188, 208, 0.08) 0%, transparent 40%),
                radial-gradient(circle at ${100-x}% ${100-y}%, rgba(211, 188, 252, 0.08) 0%, transparent 40%)
            `;
        });
    </script>
</body></html>
