<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        
        @keyframes shimmer {
            0% { transform: translate(-50%, -50%) rotate(0deg) scale(1); }
            50% { transform: translate(-45%, -55%) rotate(5deg) scale(1.1); }
            100% { transform: translate(-50%, -50%) rotate(0deg) scale(1); }
        }

        .shimmer-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            z-index: 0;
            animation: shimmer 15s infinite ease-in-out;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .btn-gradient {
            background: linear-gradient(135deg, #f2ca50 0%, #ffbcd0 100%);
            transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .btn-gradient:active {
            transform: scale(0.96);
        }

        .fade-in {
            animation: fadeIn 1.2s ease-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .letter-reveal span {
            display: inline-block;
            opacity: 0;
            transform: translateY(20px);
            animation: reveal 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes reveal {
            to { opacity: 1; transform: translateY(0); }
        }
    </style>

<script>
        // Letter reveal animation
        document.querySelectorAll('.letter-reveal span').forEach((span, idx) => {
            span.style.animationDelay = `${idx * 0.05}s`;
        });

        // Interactive subtle tilt on logo
        const logo = document.querySelector('.relative.w-20.h-20');
        document.addEventListener('mousemove', (e) => {
            const xAxis = (window.innerWidth / 2 - e.pageX) / 25;
            const yAxis = (window.innerHeight / 2 - e.pageY) / 25;
            logo.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
        });

        // Button interaction sounds/haptics simulation
        document.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('mouseenter', () => {
                btn.style.opacity = '0.9';
            });
            btn.addEventListener('mouseleave', () => {
                btn.style.opacity = '1';
            });
        });
    </script>
