<!-- Micro-interaction Scripts -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const scannerFrame = document.querySelector('.scanner-bracket');
            
            // Subtle hover tilt effect on the scanner instruction panel
            const infoPanel = document.querySelector('.glass-panel');
            infoPanel.addEventListener('mousemove', (e) => {
                const rect = infoPanel.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const centerX = rect.width / 2;
                const centerY = rect.height / 2;
                const rotateX = (y - centerY) / 10;
                const rotateY = (centerX - x) / 10;
                infoPanel.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
            });

            infoPanel.addEventListener('mouseleave', () => {
                infoPanel.style.transform = 'perspective(1000px) rotateX(0) rotateY(0)';
            });

            // Simulate a "successful scan" vibration/flash on click for demo purposes
            const frame = document.querySelector('.w-64');
            frame.addEventListener('click', () => {
                frame.classList.add('scale-95');
                setTimeout(() => {
                    frame.classList.remove('scale-95');
                    const flash = document.createElement('div');
                    flash.className = 'fixed inset-0 bg-white z-[100] pointer-events-none opacity-0 transition-opacity duration-300';
                    document.body.appendChild(flash);
                    requestAnimationFrame(() => {
                        flash.style.opacity = '0.5';
                        setTimeout(() => {
                            flash.style.opacity = '0';
                            setTimeout(() => flash.remove(), 300);
                        }, 50);
                    });
                }, 100);
            });
        });
    </script>
