<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FAF9F6" />
    <title>CamShare · Capture every memory</title>
    <link rel="icon" type="image/png" href="/favicon.png" />

    <!-- Preconnect to Google Fonts origins -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- DNS prefetch for Unsplash images -->
    <link rel="dns-prefetch" href="https://images.unsplash.com" />

    <!-- Non-render-blocking font loading: load as print then swap to all -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap"
      />
    </noscript>

    <!-- Material Symbols: fixed opsz=24, wght=400, FILL=0|1 — smallest usable subset -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL@24,400,0..1&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL@24,400,0..1&display=swap"
      />
    </noscript>

    <!-- Preload the LCP hero image -->
    <link
      rel="preload"
      as="image"
      href="https://images.unsplash.com/photo-1519741497674-611481863552?w=600&h=1100&fit=crop"
      fetchpriority="high"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
